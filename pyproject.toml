[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx-mcp"
# KEEP IN SYNC with agentx_mcp/__init__.py::__version__ (BACKLOG C12d).
# test_version_gate.py binds the two; they used to be able to drift silently.
version = "0.1.7"
description = "Keyless MCP security shield: wrap any MCP server so every tools/call is screened, and a blocked call comes back as coaching your agent recovers from. Launcher for agentx-security-sdk."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AgentX Core Team", email = "founders@agentx-core.com" }]
keywords = [
    "mcp", "model-context-protocol", "ai-agents", "agent-security",
    "llm-security", "ai-firewall", "guardrails", "tool-use", "ai-safety",
    "prompt-injection", "autonomous-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The proxy itself lives in agentx-security-sdk (imported as agentx_sdk); this
# package is a thin launcher so `uvx agentx-mcp ...` / `pipx run agentx-mcp ...`
# resolve with no `--from`.
#
# THE PIN BELOW IS A SECURITY CONTROL, not a compatibility hint. This comment names
# NO version on purpose: the pin is the only authority. Three earlier revisions of
# this text each cited whichever release was current when it was written, and each
# went stale the next time the pin moved, twice ending up stating a different version
# from the line directly beneath it. A comment that contradicts the code it describes
# is worse than no comment, so if you find yourself typing a version number here,
# that is the mistake repeating.
#
# Raise the pin when either is true:
#   1. A keyless enforcement fix ships. An MCP user upgrades only when this floor
#      forces it, so a floor an already-installed vulnerable SDK satisfies is a floor
#      that upgrades nobody, and the fix reaches nobody.
#   2. The launcher starts relying on newer SDK behaviour. This package re-exports the
#      SDK's main(), so a flag the installed SDK does not recognise is not treated as
#      a flag at all: it gets spawned as the wrapped server command and fails in a way
#      that reads as a broken product rather than a stale install.
#
# Which release closed which hole belongs in git log, not here.
#
# 🔴 PUBLISH ORDER IS LOAD-BEARING, AND IT IS WRITTEN HERE BECAUSE HERE IS WHERE THE HAZARD IS.
# The floor below can name a version that is not on PyPI yet -- these are two separate manual
# uploads. If agentx-mcp goes first, every `uvx agentx-mcp` and `pip install agentx-mcp` fails
# to resolve for new users until the SDK lands, and that is the whole keyless MCP entry path.
#
#     1. publish agentx-security-sdk        py scripts/check_pypi_version_free.py
#     2. confirm it is live                 same script, must report TAKEN
#     3. THEN publish agentx-mcp            py scripts/check_pypi_version_free.py agentx-mcp
#     4. refresh + tag the public repo      the refresh-agentx-mcp-repo skill
#
# Said three times in review and once per session in chat before it was written down. Chat is
# not a durable surface; this file is.
# Raised 0.4.28 -> 0.4.30 with the 0.1.7 cut. `uvx agentx-mcp --audit --calls` dispatches into
# the SDK's execute_audit, and --calls / --json do not exist before 0.4.30 -- so on a resolved
# older SDK the MCP door's own audit screen is missing flags its help text offers. uvx normally
# resolves the newest compatible SDK anyway; this makes that a guarantee rather than luck.
dependencies = ["agentx-security-sdk>=0.4.30"]

[project.urls]
Homepage = "https://agentx-core.com"
"Get Started" = "https://bit.ly/agentfirewall"
Docs = "https://agentx-core.com/docs"

[project.scripts]
agentx-mcp = "agentx_mcp:main"

[tool.setuptools]
packages = ["agentx_mcp"]
